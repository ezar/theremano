name: pages

# Solo manual, y a proposito. El destino de este proyecto es Vercel; GitHub
# Pages es la alternativa. Publicar en Pages exige antes habilitarlo en
# Settings -> Pages -> Source: GitHub Actions, asi que si se disparara en cada
# push a main fallaria siempre en los repositorios que no lo tengan puesto, y un
# check en rojo permanente deja de significar nada. Una vez habilitado, se lanza
# desde la pestana Actions.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub Pages sirve el proyecto en /<repo>/, asi que el build necesita
      # saber su prefijo. En Vercel la raiz es / y no hace falta tocar nada.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
