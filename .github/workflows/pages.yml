name: pages

# Este repositorio ya tiene Pages habilitado (Settings -> Pages -> Source:
# GitHub Actions), que era lo unico que faltaba para que el disparador por push
# funcionase, asi que main se publica solo. Se conserva workflow_dispatch para
# poder relanzar un despliegue sin tocar codigo.
#
# En un fork o un clon sin Pages habilitado este workflow fallara en el paso
# actions/configure-pages hasta que se active en los ajustes del repositorio.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub Pages sirve el proyecto en /<repo>/, asi que el build necesita
      # saber su prefijo. En Vercel la raiz es / y no hace falta tocar nada.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
