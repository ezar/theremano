<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#05070c" />
    <meta name="description" content="Instrumento musical controlado con las manos a traves de la camara del navegador. Sin contacto, sin instalacion, sin servidor." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!--
      Vista previa al compartir el enlace. %SITE_URL% lo sustituye vite.config.ts
      en tiempo de build a partir del entorno de despliegue: los rastreadores
      sociales no resuelven rutas relativas como hace un navegador, y con una
      ruta relativa la tarjeta se queda sin imagen.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="theremano" />
    <meta property="og:title" content="theremano" />
    <meta property="og:description" content="Un instrumento que se toca con las manos en el aire. Sin contacto, sin instalacion, en el navegador." />
    <meta property="og:image" content="%SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="theremano: un instrumento que se toca con las manos en el aire." />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="theremano" />
    <meta name="twitter:description" content="Un instrumento que se toca con las manos en el aire." />
    <meta name="twitter:image" content="%SITE_URL%og.png" />

    <title>theremano</title>
  </head>
  <body>
    <main id="stage">
      <video id="video" playsinline muted disablepictureinpicture></video>
      <canvas id="overlay"></canvas>

      <div id="hud" class="hidden">
        <div id="note-panel">
          <div id="note">--</div>
          <div id="note-sub"></div>
        </div>

        <div id="volume-rail">
          <div id="volume-track"><div id="volume-fill"></div></div>
          <span id="volume-value">0</span>
        </div>

        <div id="bottom-left">
          <div id="preset-chip"><span id="preset-name">Theremin</span><span id="preset-next" hidden></span><span id="preset-fingers"></span></div>
          <div id="hands-chip">
            <span class="hand-dot" id="dot-melody">M</span>
            <span class="hand-dot" id="dot-expression">E</span>
          </div>
        </div>

        <div id="guide-chip" hidden>
          <span id="guide-name"></span>
          <span id="guide-progress"></span>
        </div>

        <div id="loop-lanes"></div>
        <div id="hint"></div>

        <section id="coach" hidden aria-live="polite">
          <div id="coach-dots"></div>
          <h2 id="coach-title"></h2>
          <span id="coach-optional" hidden>opcional</span>
          <p id="coach-body"></p>
          <div id="coach-actions">
            <button id="coach-skip-step" type="button"></button>
            <button id="coach-skip-all" type="button"></button>
          </div>
        </section>

        <div id="diagnostics"></div>
        <div id="notice" hidden></div>
      </div>

      <div id="actions" class="hidden">
        <button id="loop-button" class="action">
          <span class="dot"></span><span class="label"></span>
        </button>
        <button id="clip-button" class="action primary">
          <span class="dot"></span><span class="label"></span>
        </button>
        <button id="undo-button" class="action ghost" hidden></button>
      </div>

      <div id="toast" hidden></div>

      <!--
        Rotulo de la demostracion. Es lo unico que se ve por encima del lienzo
        mientras el instrumento se toca solo: dice que melodia suena y como
        salir de ahi.
      -->
      <div id="demo-banner" hidden>
        <span id="demo-label"></span>
        <span id="demo-hint"></span>
        <button id="demo-stop" type="button"></button>
      </div>

      <button id="help-toggle" class="hidden">?</button>
      <button id="settings-toggle" class="hidden" aria-expanded="false"></button>

      <section id="help" hidden>
        <div id="help-sheet">
          <header>
            <h2 id="help-title"></h2>
            <button id="help-close" type="button"></button>
          </header>
          <div id="help-body"></div>
          <div class="help-actions">
            <button id="help-replay" type="button"></button>
          </div>
        </div>
      </section>
      <aside id="settings-panel" hidden aria-label="Panel de ajustes"></aside>

      <section id="splash">
        <div id="splash-inner">
          <h1>theremano</h1>
          <p class="tagline" id="splash-tagline"></p>
          <p class="invite" id="splash-invite" hidden></p>
          <ul class="howto" id="splash-bullets"></ul>
          <button id="listen-button" hidden></button>
          <button id="start-button"></button>
          <!--
            Las dos salidas que no piden permiso de camara: ver como se toca y
            tocarlo con el raton o con el dedo. Van juntas y en pequeno, debajo
            de empezar, porque son la segunda opcion de quien sabe a que viene y
            la primera de quien no.
          -->
          <div id="splash-alt">
            <button id="demo-button" type="button"></button>
            <span class="splash-sep" aria-hidden="true">·</span>
            <button id="pointer-button" type="button"></button>
          </div>
          <p id="splash-status"></p>
          <p id="splash-error" hidden></p>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
